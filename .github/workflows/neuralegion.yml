name: NeuraLegion DAST

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Authorized application or API URL to scan
        required: true
        type: string

permissions:
  contents: read

jobs:
  neuralegion_scan:
    runs-on: ubuntu-latest
    name: Run an explicitly requested security scan
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate target input
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ["TARGET_URL"]
          parsed = urlparse(value)
          if parsed.scheme not in {"https", "http"} or not parsed.netloc:
              raise SystemExit("target_url must be a valid HTTP(S) URL")
          PY

      - name: Start NeuraLegion scan
        id: start
        uses: NeuraLegion/run-scan@29ebd17b4fd6292ce7a238a59401668953b37fbe
        with:
          api_token: ${{ secrets.NEURALEGION_TOKEN }}
          name: Authorized scan ${{ github.sha }}
          discovery_types: |
            [ "crawler" ]
          crawler_urls: |
            [ "${{ inputs.target_url }}" ]
