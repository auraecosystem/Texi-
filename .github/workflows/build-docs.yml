name: Build Texinfo documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: texinfo-pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Texinfo and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texinfo texlive-latex-base texlive-plain-generic texlive-fonts-recommended

      - name: Build Info and HTML
        run: make all

      - name: Build PDF
        run: make pdf

      - name: Upload compiled manuals
        uses: actions/upload-artifact@v4
        with:
          name: texinfo-manuals
          path: |
            mymanual.info
            mymanual.pdf
            mymanual_html/

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: mymanual_html/

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest boto3

      - name: Run repository and TTL reaper tests
        run: make test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GITHUB_PAGES == 'true'
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
