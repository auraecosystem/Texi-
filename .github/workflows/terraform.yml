name: Terraform validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize root stack without remote state
        run: terraform init -backend=false

      - name: Validate root stack
        run: terraform validate

      - name: Initialize runtime module
        working-directory: modules/lmlmxtend-runtime
        run: terraform init -backend=false

      - name: Validate runtime module
        working-directory: modules/lmlmxtend-runtime
        run: terraform validate

      - name: Run Terraform module tests
        working-directory: modules/lmlmxtend-runtime
        run: terraform test
